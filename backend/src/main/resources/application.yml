spring:
  application:
    name: opspulse

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/opspulse}
    username: ${DB_USER:opspulse}
    password: ${DB_PASSWORD:opspulse}
    hikari:
      maximum-pool-size: 15
      pool-name: opspulse-pool

  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate must never touch it.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

server:
  port: 8080
  # SSE streams must not be buffered or compressed by the container.
  compression:
    enabled: false

management:
  endpoints.web.exposure.include: health,info,metrics
  endpoint.health.show-details: when_authorized

opspulse:
  jwt:
    # override in every non-local environment
    secret: ${JWT_SECRET:change-me-this-must-be-at-least-256-bits-long-for-hs256-ok}
    access-token-ttl: 15m
    refresh-token-ttl: 30d
  ingest:
    rate-limit-per-minute: 600
    dedup-cache-ttl: 1h
  escalation:
    sweep-interval-ms: 30000

logging:
  level:
    com.opspulse: DEBUG
