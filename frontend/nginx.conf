# The browser talks only to this nginx. Static files are served directly and
# /api is proxied to the backend container, so the UI and API share an origin:
# no CORS, and no API URL baked into the JavaScript bundle.
server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite puts a content hash in every asset filename, so they can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routes (/incidents/abc) have no file: serve the app and let it route.
    # index.html itself must never be cached, or users keep loading old asset hashes.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
